payload:
  instructions: "## When to Use This Skill\n\nMaster orchestrator, peer-to-peer, and hierarchical multi-agent architectures\n\
    \nUse this skill when working with master orchestrator, peer-to-peer, and hierarchical multi-agent architectures.\n# Multi-Agent\
    \ Architecture Patterns\n\nMulti-agent architectures distribute work across multiple language model instances, each with\
    \ its own context window. When designed well, this distribution enables capabilities beyond single-agent limits. When\
    \ designed poorly, it introduces coordination overhead that negates benefits. The critical insight is that sub-agents\
    \ exist primarily to isolate context, not to anthropomorphize role division.\n\n## When to Activate\n\nActivate this skill\
    \ when:\n- Single-agent context limits constrain task complexity\n- Tasks decompose naturally into parallel subtasks\n\
    - Different subtasks require different tool sets or system prompts\n- Building systems that must handle multiple domains\
    \ simultaneously\n- Scaling agent capabilities beyond single-context limits\n- Designing production agent systems with\
    \ multiple specialized components\n\n## Core Concepts\n\nMulti-agent systems address single-agent context limitations\
    \ through distribution. Three dominant patterns exist: supervisor/orchestrator for centralized control, peer-to-peer/swarm\
    \ for flexible handoffs, and hierarchical for layered abstraction. The critical design principle is context isolation—sub-agents\
    \ exist primarily to partition context rather than to simulate organizational roles.\n\nEffective multi-agent systems\
    \ require explicit coordination protocols, consensus mechanisms that avoid sycophancy, and careful attention to failure\
    \ modes including bottlenecks, divergence, and error propagation.\n\n## Detailed Topics\n\n### Why Multi-Agent Architectures\n\
    \n**The Context Bottleneck**\nSingle agents face inherent ceilings in reasoning capability, context management, and tool\
    \ coordination. As tasks grow more complex, context windows fill with accumulated history, retrieved documents, and tool\
    \ outputs. Performance degrades according to predictable patterns: the lost-in-middle effect, attention scarcity, and\
    \ context poisoning.\n\nMulti-agent architectures address these limitations by partitioning work across multiple context\
    \ windows. Each agent operates in a clean context focused on its subtask. Results aggregate at a coordination layer without\
    \ any single context bearing the full burden.\n\n**The Token Economics Reality**\nMulti-agent systems consume significantly\
    \ more tokens than single-agent approaches. Production data shows:\n\n| Architecture | Token Multiplier | Use Case |\n\
    |--------------|------------------|----------|\n| Single agent chat | 1× baseline | Simple queries |\n| Single agent with\
    \ tools | ~4× baseline | Tool-using tasks |\n| Multi-agent system | ~15× baseline | Complex research/coordination |\n\n\
    Research on the BrowseComp evaluation found that three factors explain 95% of performance variance: token usage (80% of\
    \ variance), number of tool calls, and model choice. This validates the multi-agent approach of distributing work across\
    \ agents with separate context windows to add capacity for parallel reasoning.\n\nCritically, upgrading to better models\
    \ often provides larger performance gains than doubling token budgets. Claude Sonnet 4.5 showed larger gains than doubling\
    \ tokens on earlier Sonnet versions. GPT-5.2's thinking mode similarly outperforms raw token increases. This suggests\
    \ model selection and multi-agent architecture are complementary strategies.\n\n**The Parallelization Argument**\nMany\
    \ tasks contain parallelizable subtasks that a single agent must execute sequentially. A research task might require searching\
    \ multiple independent sources, analyzing different documents, or comparing competing approaches. A single agent processes\
    \ these sequentially, accumulating context with each step.\n\nMulti-agent architectures assign each subtask to a dedicated\
    \ agent with a fresh context. All agents work simultaneously, then return results to a coordinator. The total real-world\
    \ time approaches the duration of the longest subtask rather than the sum of all subtasks.\n\n**The Specialization Argument**\n\
    Different tasks benefit from different agent configurations: different system prompts, different tool sets, different\
    \ context structures. A general-purpose agent must carry all possible configurations in context. Specialized agents carry\
    \ only what they need.\n\nMulti-agent architectures enable specialization without combinatorial explosion. The coordinator\
    \ routes to specialized agents; each agent operates with lean context optimized for its domain.\n\n### Architectural Patterns\n\
    \n**Pattern 1: Supervisor/Orchestrator**\nThe supervisor pattern places a central agent in control, delegating to specialists\
    \ and synthesizing results. The supervisor maintains global state and trajectory, decomposes user objectives into subtasks,\
    \ and routes to appropriate workers.\n\n```\nUser Query -> Supervisor -> [Specialist, Specialist, Specialist] -> Aggregation\
    \ -> Final Output\n```\n\nWhen to use: Complex tasks with clear decomposition, tasks requiring coordination across domains,\
    \ tasks where human oversight is important.\n\nAdvantages: Strict control over workflow, easier to implement human-in-the-loop\
    \ interventions, ensures adherence to predefined plans.\n\nDisadvantages: Supervisor context becomes bottleneck, supervisor\
    \ failures cascade to all workers, \"telephone game\" problem where supervisors paraphrase sub-agent responses incorrectly.\n\
    \n**The Telephone Game Problem and Solution**\nLangGraph benchmarks found supervisor architectures initially performed\
    \ 50% worse than optimized versions due to the \"telephone game\" problem where supervisors paraphrase sub-agent responses\
    \ incorrectly, losing fidelity.\n\nThe fix: implement a `forward_message` tool allowing sub-agents to pass responses directly\
    \ to users:\n\n```python\ndef forward_message(message: str, to_user: bool = True):\n    \"\"\"\n    Forward sub-agent\
    \ response directly to user without supervisor synthesis.\n    \n    Use when:\n    - Sub-agent response is final and\
    \ complete\n    - Supervisor synthesis would lose important details\n    - Response format must be preserved exactly\n\
    \    \"\"\"\n    if to_user:\n        return {\"type\": \"direct_response\", \"content\": message}\n    return {\"type\"\
    : \"supervisor_input\", \"content\": message}\n```\n\nWith this pattern, swarm architectures slightly outperform supervisors\
    \ because sub-agents respond directly to users, eliminating translation errors.\n\nImplementation note: Implement direct\
    \ pass-through mechanisms allowing sub-agents to pass responses directly to users rather than through supervisor synthesis\
    \ when appropriate.\n\n**Pattern 2: Peer-to-Peer/Swarm**\nThe peer-to-peer pattern removes central control, allowing agents\
    \ to communicate directly based on predefined protocols. Any agent can transfer control to any other through explicit\
    \ handoff mechanisms.\n\n```python\ndef transfer_to_agent_b():\n    return agent_b  # Handoff via function return\n\n\
    agent_a = Agent(\n    name=\"Agent A\",\n    functions=[transfer_to_agent_b]\n)\n```\n\nWhen to use: Tasks requiring flexible\
    \ exploration, tasks where rigid planning is counterproductive, tasks with emergent requirements that defy upfront decomposition.\n\
    \nAdvantages: No single point of failure, scales effectively for breadth-first exploration, enables emergent problem-solving\
    \ behaviors.\n\nDisadvantages: Coordination complexity increases with agent count, risk of divergence without central\
    \ state keeper, requires robust convergence constraints.\n\nImplementation note: Define explicit handoff protocols with\
    \ state passing. Ensure agents can communicate their context needs to receiving agents.\n\n**Pattern 3: Hierarchical**\n\
    Hierarchical structures organize agents into layers of abstraction: strategic, planning, and execution layers. Strategy\
    \ layer agents define goals and constraints; planning layer agents break goals into actionable plans; execution layer\
    \ agents perform atomic tasks.\n\n```\nStrategy Layer (Goal Definition) -> Planning Layer (Task Decomposition) -> Execution\
    \ Layer (Atomic Tasks)\n```\n\nWhen to use: Large-scale projects with clear hierarchical structure, enterprise workflows\
    \ with management layers, tasks requiring both high-level planning and detailed execution.\n\nAdvantages: Mirrors organizational\
    \ structures, clear separation of concerns, enables different context structures at different levels.\n\nDisadvantages:\
    \ Coordination overhead between layers, potential for misalignment between strategy and execution, complex error propagation.\n\
    \n### Context Isolation as Design Principle\n\nThe primary purpose of multi-agent architectures is context isolation.\
    \ Each sub-agent operates in a clean context window focused on its subtask without carrying accumulated context from other\
    \ subtasks.\n\n**Isolation Mechanisms**\nFull context delegation: For complex tasks where the sub-agent needs complete\
    \ understanding, the planner shares its entire context. The sub-agent has its own tools and instructions but receives\
    \ full context for its decisions.\n\nInstruction passing: For simple, well-defined subtasks, the planner creates instructions\
    \ via function call. The sub-agent receives only the instructions needed for its specific task.\n\nFile system memory:\
    \ For complex tasks requiring shared state, agents read and write to persistent storage. The file system serves as the\
    \ coordination mechanism, avoiding context bloat from shared state passing.\n\n**Isolation Trade-offs**\nFull context\
    \ delegation provides maximum capability but defeats the purpose of sub-agents. Instruction passing maintains isolation\
    \ but limits sub-agent flexibility. File system memory enables shared state without context passing but introduces latency\
    \ and consistency challenges.\n\nThe right choice depends on task complexity, coordination needs, and acceptable latency.\n\
    \n### Consensus and Coordination\n\n**The Voting Problem**\nSimple majority voting treats hallucinations from weak models\
    \ as equal to reasoning from strong models. Without intervention, multi-agent discussions devolve into consensus on false\
    \ premises due to inherent bias toward agreement.\n\n**Weighted Voting**\nWeight agent votes by confidence or expertise.\
    \ Agents with higher confidence or domain expertise carry more weight in final decisions.\n\n**Debate Protocols**\nDebate\
    \ protocols require agents to critique each other's outputs over multiple rounds. Adversarial critique often yields higher\
    \ accuracy on complex reasoning than collaborative consensus.\n\n**Trigger-Based Intervention**\nMonitor multi-agent interactions\
    \ for specific behavioral markers. Stall triggers activate when discussions make no progress. Sycophancy triggers detect\
    \ when agents mimic each other's answers without unique reasoning.\n\n### Framework Considerations\n\nDifferent frameworks\
    \ implement these patterns with different philosophies. LangGraph uses graph-based state machines with explicit nodes\
    \ and edges. AutoGen uses conversational/event-driven patterns with GroupChat. CrewAI uses role-based process flows with\
    \ hierarchical crew structures.\n\n## Practical Guidance\n\n### Failure Modes and Mitigations\n\n**Failure: Supervisor\
    \ Bottleneck**\nThe supervisor accumulates context from all workers, becoming susceptible to saturation and degradation.\n\
    \nMitigation: Implement output schema constraints so workers return only distilled summaries. Use checkpointing to persist\
    \ supervisor state without carrying full history.\n\n**Failure: Coordination Overhead**\nAgent communication consumes\
    \ tokens and introduces latency. Complex coordination can negate parallelization benefits.\n\nMitigation: Minimize communication\
    \ through clear handoff protocols. Batch results where possible. Use asynchronous communication patterns.\n\n**Failure:\
    \ Divergence**\nAgents pursuing different goals without central coordination can drift from intended objectives.\n\nMitigation:\
    \ Define clear objective boundaries for each agent. Implement convergence checks that verify progress toward shared goals.\
    \ Use time-to-live limits on agent execution.\n\n**Failure: Error Propagation**\nErrors in one agent's output propagate\
    \ to downstream agents that consume that output.\n\nMitigation: Validate agent outputs before passing to consumers. Implement\
    \ retry logic with circuit breakers. Use idempotent operations where possible.\n\n## Examples\n\n**Example 1: Research\
    \ Team Architecture**\n```text\nSupervisor\n├── Researcher (web search, document retrieval)\n├── Analyzer (data analysis,\
    \ statistics)\n├── Fact-checker (verification, validation)\n└── Writer (report generation, formatting)\n```\n\n**Example\
    \ 2: Handoff Protocol**\n```python\ndef handle_customer_request(request):\n    if request.type == \"billing\":\n     \
    \   return transfer_to(billing_agent)\n    elif request.type == \"technical\":\n        return transfer_to(technical_agent)\n\
    \    elif request.type == \"sales\":\n        return transfer_to(sales_agent)\n    else:\n        return handle_general(request)\n\
    ```\n\n## Guidelines\n\n1. Design for context isolation as the primary benefit of multi-agent systems\n2. Choose architecture\
    \ pattern based on coordination needs, not organizational metaphor\n3. Implement explicit handoff protocols with state\
    \ passing\n4. Use weighted voting or debate protocols for consensus\n5. Monitor for supervisor bottlenecks and implement\
    \ checkpointing\n6. Validate outputs before passing between agents\n7. Set time-to-live limits to prevent infinite loops\n\
    8. Test failure scenarios explicitly\n\n## Integration\n\nThis skill builds on context-fundamentals and context-degradation.\
    \ It connects to:\n\n- memory-systems - Shared state management across agents\n- tool-design - Tool specialization per\
    \ agent\n- context-optimization - Context partitioning strategies\n\n## References\n\nInternal reference:\n- [Frameworks\
    \ Reference](./references/frameworks.md) - Detailed framework implementation patterns\n\nRelated skills in this collection:\n\
    - context-fundamentals - Context basics\n- memory-systems - Cross-agent memory\n- context-optimization - Partitioning\
    \ strategies\n\nExternal resources:\n- [LangGraph Documentation](https://langchain-ai.github.io/langgraph/) - Multi-agent\
    \ patterns and state management\n- [AutoGen Framework](https://microsoft.github.io/autogen/) - GroupChat and conversational\
    \ patterns\n- [CrewAI Documentation](https://docs.crewai.com/) - Hierarchical agent processes\n- [Research on Multi-Agent\
    \ Coordination](https://arxiv.org/abs/2308.00352) - Survey of multi-agent systems\n\n---\n\n## Skill Metadata\n\n**Created**:\
    \ 2025-12-20\n**Last Updated**: 2025-12-20\n**Author**: Agent Skills for Context Engineering Contributors\n**Version**:\
    \ 1.0.0"
