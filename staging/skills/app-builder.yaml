payload:
  instructions: "# App Builder - Application Building Orchestrator\n\n> Analyzes user's requests, determines tech stack, plans\
    \ structure, and coordinates agents.\n\n## \U0001F3AF Selective Reading Rule\n\n**Read ONLY files relevant to the request!**\
    \ Check the content map, find what you need.\n\n| File | Description | When to Read |\n|------|-------------|--------------|\n\
    | `project-detection.md` | Keyword matrix, project type detection | Starting new project |\n| `tech-stack.md` | 2025 default\
    \ stack, alternatives | Choosing technologies |\n| `agent-coordination.md` | Agent pipeline, execution order | Coordinating\
    \ multi-agent work |\n| `scaffolding.md` | Directory structure, core files | Creating project structure |\n| `feature-building.md`\
    \ | Feature analysis, error handling | Adding features to existing project |\n| `templates/SKILL.md` | **Project templates**\
    \ | Scaffolding new project |\n\n---\n\n## \U0001F4E6 Templates (13)\n\nQuick-start scaffolding for new projects. **Read\
    \ the matching template only!**\n\n| Template | Tech Stack | When to Use |\n|----------|------------|-------------|\n\
    | [nextjs-fullstack](templates/nextjs-fullstack/TEMPLATE.md) | Next.js + Prisma | Full-stack web app |\n| [nextjs-saas](templates/nextjs-saas/TEMPLATE.md)\
    \ | Next.js + Stripe | SaaS product |\n| [nextjs-static](templates/nextjs-static/TEMPLATE.md) | Next.js + Framer | Landing\
    \ page |\n| [nuxt-app](templates/nuxt-app/TEMPLATE.md) | Nuxt 3 + Pinia | Vue full-stack app |\n| [express-api](templates/express-api/TEMPLATE.md)\
    \ | Express + JWT | REST API |\n| [python-fastapi](templates/python-fastapi/TEMPLATE.md) | FastAPI | Python API |\n| [react-native-app](templates/react-native-app/TEMPLATE.md)\
    \ | Expo + Zustand | Mobile app |\n| [flutter-app](templates/flutter-app/TEMPLATE.md) | Flutter + Riverpod | Cross-platform\
    \ mobile |\n| [electron-desktop](templates/electron-desktop/TEMPLATE.md) | Electron + React | Desktop app |\n| [chrome-extension](templates/chrome-extension/TEMPLATE.md)\
    \ | Chrome MV3 | Browser extension |\n| [cli-tool](templates/cli-tool/TEMPLATE.md) | Node.js + Commander | CLI app |\n\
    | [monorepo-turborepo](templates/monorepo-turborepo/TEMPLATE.md) | Turborepo + pnpm | Monorepo |\n\n---\n\n## \U0001F517\
    \ Related Agents\n\n| Agent | Role |\n|-------|------|\n| `project-planner` | Task breakdown, dependency graph |\n| `frontend-specialist`\
    \ | UI components, pages |\n| `backend-specialist` | API, business logic |\n| `database-architect` | Schema, migrations\
    \ |\n| `devops-engineer` | Deployment, preview |\n\n---\n\n## Usage Example\n\n```\nUser: \"Make an Instagram clone with\
    \ photo sharing and likes\"\n\nApp Builder Process:\n1. Project type: Social Media App\n2. Tech stack: Next.js + Prisma\
    \ + Cloudinary + Clerk\n3. Create plan:\n   ├─ Database schema (users, posts, likes, follows)\n   ├─ API routes (12 endpoints)\n\
    \   ├─ Pages (feed, profile, upload)\n   └─ Components (PostCard, Feed, LikeButton)\n4. Coordinate agents\n5. Report progress\n\
    6. Start preview\n```\n\n---\n\n## templates\n\n# Project Templates\n\n> Quick-start templates for scaffolding new projects.\n\
    \n---\n\n## \U0001F3AF Selective Reading Rule\n\n**Read ONLY the template matching user's project type!**\n\n| Template\
    \ | Tech Stack | When to Use |\n|----------|------------|-------------|\n| [nextjs-fullstack](nextjs-fullstack/TEMPLATE.md)\
    \ | Next.js + Prisma | Full-stack web app |\n| [nextjs-saas](nextjs-saas/TEMPLATE.md) | Next.js + Stripe | SaaS product\
    \ |\n| [nextjs-static](nextjs-static/TEMPLATE.md) | Next.js + Framer | Landing page |\n| [express-api](express-api/TEMPLATE.md)\
    \ | Express + JWT | REST API |\n| [python-fastapi](python-fastapi/TEMPLATE.md) | FastAPI | Python API |\n| [react-native-app](react-native-app/TEMPLATE.md)\
    \ | Expo + Zustand | Mobile app |\n| [flutter-app](flutter-app/TEMPLATE.md) | Flutter + Riverpod | Cross-platform |\n\
    | [electron-desktop](electron-desktop/TEMPLATE.md) | Electron + React | Desktop app |\n| [chrome-extension](chrome-extension/TEMPLATE.md)\
    \ | Chrome MV3 | Browser extension |\n| [cli-tool](cli-tool/TEMPLATE.md) | Node.js + Commander | CLI app |\n| [monorepo-turborepo](monorepo-turborepo/TEMPLATE.md)\
    \ | Turborepo + pnpm | Monorepo |\n| [astro-static](astro-static/TEMPLATE.md) | Astro + MDX | Blog / Docs |\n\n---\n\n\
    ## Usage\n\n1. User says \"create [type] app\"\n2. Match to appropriate template\n3. Read ONLY that template's TEMPLATE.md\n\
    4. Follow its tech stack and structure"
