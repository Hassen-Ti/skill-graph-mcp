id: backend_dev
name: Backend Developer
type: role
author: core-team
version: 1.0.0
description: Backend development role. Thinks in APIs, services, and data pipelines.
priority: 2
extends: software_engineer
edges:
- to: security
  type: requires
- to: backend-architect
  type: enables
- to: dotnet-architect
  type: enables
- to: backend-development-feature-development
